name: Vercel Production Promotion

on:
  workflow_dispatch:
    inputs:
      candidate_deployment:
        description: Exact reviewed staged Production deployment ID or immutable URL
        required: true
        type: string
      expected_sha:
        description: Full 40-character candidate SHA; must equal current main
        required: true
        type: string
      expected_production_anchor:
        description: Production deployment ID recorded in the reviewed candidate receipt
        required: true
        type: string
      release:
        description: Release identifier recorded in candidate metadata
        required: true
        type: string

permissions:
  actions: read
  contents: read

concurrency:
  group: vercel-production-release
  cancel-in-progress: false

jobs:
  promote-production:
    name: Promote exact staged candidate
    runs-on: ubuntu-latest
    timeout-minutes: 40
    environment:
      name: Production
      url: https://www.carlophillips.com
    env:
      VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}

    steps:
      - name: Enforce external Production enablement
        env:
          PROMOTION_ENABLED: ${{ vars.CP_PRODUCTION_PROMOTION_ENABLED }}
          GH_TOKEN: ${{ github.token }}
        run: |
          test "$PROMOTION_ENABLED" = "true"
          gh api "repos/$GITHUB_REPOSITORY/environments/Production" > production-environment.json
          node - <<'NODE'
          const fs = require('node:fs');
          const environment = JSON.parse(fs.readFileSync('production-environment.json', 'utf8'));
          const reviewerRule = environment.protection_rules?.find(rule => rule.type === 'required_reviewers');
          if (!reviewerRule || !Array.isArray(reviewerRule.reviewers) || reviewerRule.reviewers.length === 0) {
            throw new Error('Production promotion is disabled until the Production environment has a required reviewer.');
          }
          NODE

      - name: Check out canonical main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Validate immutable release inputs
        env:
          CANDIDATE_DEPLOYMENT: ${{ inputs.candidate_deployment }}
          EXPECTED_SHA: ${{ inputs.expected_sha }}
          EXPECTED_PRODUCTION_ANCHOR: ${{ inputs.expected_production_anchor }}
          RELEASE: ${{ inputs.release }}
        run: |
          test "$GITHUB_REF" = "refs/heads/main"
          [[ "$EXPECTED_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$CANDIDATE_DEPLOYMENT" =~ ^(dpl_[A-Za-z0-9]+|https://[A-Za-z0-9.-]+\.vercel\.app)$ ]]
          [[ "$EXPECTED_PRODUCTION_ANCHOR" =~ ^dpl_[A-Za-z0-9]+$ ]]
          [[ "$RELEASE" =~ ^[A-Za-z0-9._-]+$ ]]
          test "$EXPECTED_SHA" = "$GITHUB_SHA"
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          test -n "$VERCEL_ORG_ID"
          test -n "$VERCEL_PROJECT_ID"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Activate Yarn Classic
        run: |
          corepack enable
          corepack prepare yarn@1.22.22 --activate
          test "$(yarn --version)" = "1.22.22"

      - name: Install pinned Vercel CLI
        run: |
          yarn global add vercel@56.1.0
          echo "$(yarn global bin)" >> "$GITHUB_PATH"
          export PATH="$(yarn global bin):$PATH"
          test "$(vercel --version | tail -1)" = "56.1.0"

      - name: Link exact Vercel project without pulling environment data
        run: |
          node - <<'NODE'
          const fs = require('node:fs');
          const orgId = process.env.VERCEL_ORG_ID;
          const projectId = process.env.VERCEL_PROJECT_ID;
          if (!orgId || !projectId) throw new Error('Vercel project identifiers are required.');
          fs.mkdirSync('.vercel', { recursive: true });
          fs.writeFileSync('.vercel/project.json', `${JSON.stringify({ orgId, projectId })}\n`, { mode: 0o600 });
          NODE

      - name: Capture selected candidate and rollback anchor
        env:
          CANDIDATE_DEPLOYMENT: ${{ inputs.candidate_deployment }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          vercel inspect "$CANDIDATE_DEPLOYMENT" --wait --timeout=5m --format=json --token="$VERCEL_TOKEN" > candidate-inspect.json
          vercel list --meta cpGitCommitSha="$GITHUB_SHA" --limit=10 --format=json --token="$VERCEL_TOKEN" > candidate-list.json
          vercel inspect www.carlophillips.com --format=json --token="$VERCEL_TOKEN" > production-before.json

      - name: Verify selected candidate without deployment credential
        env:
          EXPECTED_PRODUCTION_ANCHOR: ${{ inputs.expected_production_anchor }}
          RELEASE: ${{ inputs.release }}
        run: |
          node .github/scripts/verify-vercel-receipt.mjs candidate \
            --candidate-inspect candidate-inspect.json \
            --candidate-list candidate-list.json \
            --production-before production-before.json \
            --production-after production-before.json \
            --expected-production-anchor "$EXPECTED_PRODUCTION_ANCHOR" \
            --expected-sha "$GITHUB_SHA" \
            --expected-release "$RELEASE" \
            --output selected-candidate-receipt.json

      - name: Capture current Production immediately before promotion
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: >-
          vercel inspect www.carlophillips.com --format=json --token="$VERCEL_TOKEN"
          > production-immediate-before.json

      - name: Reject rollback-anchor drift before promotion
        env:
          EXPECTED_PRODUCTION_ANCHOR: ${{ inputs.expected_production_anchor }}
          RELEASE: ${{ inputs.release }}
        run: |
          node .github/scripts/verify-vercel-receipt.mjs candidate \
            --candidate-inspect candidate-inspect.json \
            --candidate-list candidate-list.json \
            --production-before production-before.json \
            --production-after production-immediate-before.json \
            --expected-production-anchor "$EXPECTED_PRODUCTION_ANCHOR" \
            --expected-sha "$GITHUB_SHA" \
            --expected-release "$RELEASE" \
            --output pre-promotion-candidate-receipt.json

      - name: Promote the exact staged candidate
        id: promotion
        continue-on-error: true
        env:
          CANDIDATE_DEPLOYMENT: ${{ inputs.candidate_deployment }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          echo "attempted=true" >> "$GITHUB_OUTPUT"
          vercel promote "$CANDIDATE_DEPLOYMENT" --yes --timeout=5m --token="$VERCEL_TOKEN"

      - name: Require a recorded promotion attempt
        if: ${{ always() && steps.promotion.outcome != 'skipped' }}
        env:
          PROMOTION_ATTEMPTED: ${{ steps.promotion.outputs.attempted }}
        run: test "$PROMOTION_ATTEMPTED" = "true"

      - name: Capture Production state after promotion attempt
        if: ${{ always() && steps.promotion.outputs.attempted == 'true' }}
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          vercel inspect www.carlophillips.com --wait --timeout=5m --format=json --token="$VERCEL_TOKEN" > production-after.json
          vercel list --environment=production --limit=10 --format=json --token="$VERCEL_TOKEN" > production-list.json

      - name: Verify Production promotion identity without deployment credential
        if: ${{ always() && steps.promotion.outputs.attempted == 'true' }}
        env:
          PROMOTION_OUTCOME: ${{ steps.promotion.outcome }}
          EXPECTED_PRODUCTION_ANCHOR: ${{ inputs.expected_production_anchor }}
          RELEASE: ${{ inputs.release }}
        run: |
          test "$PROMOTION_OUTCOME" = "success"
          node .github/scripts/verify-vercel-receipt.mjs production \
            --candidate-inspect candidate-inspect.json \
            --candidate-list candidate-list.json \
            --production-before production-before.json \
            --production-after production-after.json \
            --production-list production-list.json \
            --expected-production-anchor "$EXPECTED_PRODUCTION_ANCHOR" \
            --expected-sha "$GITHUB_SHA" \
            --expected-release "$RELEASE" \
            --output production-release-receipt.json

      - name: Run fail-fast Production route smoke test
        run: |
          for route in / /shop /collections /products/carlophillips-signature-hoodie /bag; do
            curl --fail --silent --show-error --location --max-time 30 "https://www.carlophillips.com$route" > /dev/null
          done
          curl --fail --silent --show-error --location --max-time 30 \
            "https://www.carlophillips.com/products/carlophillips-signature-hoodie" > production-pdp.html
          node - <<'NODE'
          const fs = require('node:fs');
          const html = fs.readFileSync('production-pdp.html', 'utf8');
          if (!html.includes('Selection disabled')) throw new Error('Production PDP is missing the disabled-selection proof.');
          if (!html.includes('Purchasing disabled')) throw new Error('Production PDP is missing the fail-closed purchasing proof.');
          if (html.includes('Continue to checkout')) throw new Error('Production PDP unexpectedly exposes checkout continuation.');
          if (/<form\b[^>]*>[\s\S]*?type=["']submit["']/i.test(html)) {
            throw new Error('Production PDP unexpectedly exposes an enabled submit form.');
          }
          NODE

      - name: Publish workflow receipt
        run: |
          {
            echo "## Vercel Production promotion receipt"
            echo "- Commit: $GITHUB_SHA"
            echo "- Staged candidate: ${{ inputs.candidate_deployment }}"
            echo "- Production domain: https://www.carlophillips.com"
            echo "- Receipt artifact: production-release-receipt"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload immutable Production receipt
        uses: actions/upload-artifact@v4
        with:
          name: production-release-receipt-${{ github.sha }}
          path: |
            production-environment.json
            candidate-inspect.json
            candidate-list.json
            selected-candidate-receipt.json
            production-before.json
            production-immediate-before.json
            pre-promotion-candidate-receipt.json
            production-after.json
            production-list.json
            production-release-receipt.json
            production-pdp.html
          if-no-files-found: error
          retention-days: 90

      - name: Capture live Production for rollback planning
        if: ${{ always() && failure() && steps.promotion.outputs.attempted == 'true' }}
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: >-
          vercel inspect www.carlophillips.com --format=json --token="$VERCEL_TOKEN"
          > production-current-before-rollback.json

      - name: Plan rollback without deployment credential
        id: rollback-plan
        if: ${{ always() && failure() && steps.promotion.outputs.attempted == 'true' }}
        run: |
          node .github/scripts/reconcile-vercel-rollback.mjs plan \
            --production-before production-before.json \
            --production-current production-current-before-rollback.json \
            --github-output "$GITHUB_OUTPUT" \
            --output production-rollback-plan.json

      - name: Restore captured Production when drifted
        id: rollback
        if: ${{ always() && failure() && steps.promotion.outputs.attempted == 'true' && steps.rollback-plan.outputs.rollback_required == 'true' }}
        env:
          ROLLBACK_DEPLOYMENT_ID: ${{ steps.rollback-plan.outputs.rollback_deployment_id }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: vercel rollback "$ROLLBACK_DEPLOYMENT_ID" --yes --timeout=5m --token="$VERCEL_TOKEN"

      - name: Capture Production after rollback reconciliation
        if: ${{ always() && failure() && steps.promotion.outputs.attempted == 'true' }}
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: >-
          vercel inspect www.carlophillips.com --wait --timeout=5m --format=json --token="$VERCEL_TOKEN"
          > production-rollback.json

      - name: Verify rollback reconciliation without deployment credential
        if: ${{ always() && failure() && steps.promotion.outputs.attempted == 'true' }}
        env:
          ROLLBACK_DEPLOYMENT_ID: ${{ inputs.expected_production_anchor }}
        run: |
          node .github/scripts/reconcile-vercel-rollback.mjs verify \
            --production-before production-before.json \
            --production-after production-rollback.json \
            --output production-rollback-receipt.json
          {
            echo "## Automatic rollback"
            echo "- Restored deployment: $ROLLBACK_DEPLOYMENT_ID"
            echo "- Reason: an attempted promotion had an ambiguous command, identity, smoke, or receipt failure"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload rollback evidence
        if: ${{ always() && failure() && steps.promotion.outputs.attempted == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: production-rollback-receipt-${{ github.sha }}
          path: |
            production-before.json
            production-immediate-before.json
            production-after.json
            production-current-before-rollback.json
            production-rollback-plan.json
            production-rollback.json
            production-rollback-receipt.json
            production-pdp.html
          if-no-files-found: warn
          retention-days: 90
