name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: yarn
          cache-dependency-path: yarn.lock

      - name: Activate Yarn Classic
        run: |
          corepack enable
          corepack prepare yarn@1.22.22 --activate
          test "$(yarn --version)" = "1.22.22"

      - name: Install locked dependencies
        run: yarn install --frozen-lockfile

      - name: Verify repository
        run: yarn verify

      - name: Install headless accessibility browser
        run: yarn playwright install --with-deps chromium

      - name: Run accessibility and privacy network audit
        env:
          CP_A11Y_OUTPUT_DIR: test_reports/ci/accessibility
        run: |
          mkdir -p test_reports/ci
          yarn start > /tmp/cp-next-start.log 2>&1 &
          app_pid=$!
          trap 'kill "$app_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 30); do
            curl --fail --silent http://127.0.0.1:3000/ > /dev/null && break
            if [ "$attempt" -eq 30 ]; then
              cat /tmp/cp-next-start.log
              exit 1
            fi
            sleep 1
          done
          yarn test:a11y

      - name: Upload test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-evidence-${{ github.sha }}
          path: test_reports/ci/
          if-no-files-found: warn
          retention-days: 30
