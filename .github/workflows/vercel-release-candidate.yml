name: Vercel Production Candidate

on:
  workflow_dispatch:
    inputs:
      expected_sha:
        description: Full 40-character main SHA to build
        required: true
        type: string
      release:
        description: Immutable release identifier
        required: true
        type: string
      source_pr:
        description: Merged pull request bound to the protected Staging receipt
        required: true
        type: number
      proof_run_id:
        description: Successful Protected Staging Release Proof workflow run ID
        required: true
        type: string

permissions:
  actions: read
  contents: read
  pull-requests: read

concurrency:
  group: vercel-production-candidate
  cancel-in-progress: false

jobs:
  build-candidate:
    name: Build checkout-enabled Production candidate
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: Production
    env:
      VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
      NEXT_PUBLIC_COMMERCE_ENVIRONMENT: production
      NEXT_PUBLIC_SHOW_PRODUCTS: 'true'
      COMMERCE_DATA_MODE: shopify
      SHOPIFY_CART_UI_ENABLED: 'true'
      SHOPIFY_CHECKOUT_ENABLED: 'true'
      CP_RELEASE_ID: ${{ inputs.release }}
      CP_RELEASE_COMMIT_SHA: ${{ inputs.expected_sha }}

    steps:
      - name: Check out exact main SHA
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.expected_sha }}
          fetch-depth: 0

      - name: Validate immutable candidate input
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha }}
          RELEASE: ${{ inputs.release }}
        run: |
          [[ "$EXPECTED_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$RELEASE" =~ ^[A-Za-z0-9._-]+$ ]]
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          test "$(git rev-parse origin/main)" = "$EXPECTED_SHA"
          test "$SHOPIFY_CART_UI_ENABLED" = "true"
          test "$SHOPIFY_CHECKOUT_ENABLED" = "true"
          test "$CP_RELEASE_ID" = "$RELEASE"
          test "$CP_RELEASE_COMMIT_SHA" = "$EXPECTED_SHA"
          test -n "$VERCEL_ORG_ID"
          test -n "$VERCEL_PROJECT_ID"

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: yarn

      - name: Download and verify the signed protected Staging receipt
        env:
          GH_TOKEN: ${{ github.token }}
          PROOF_RUN_ID: ${{ inputs.proof_run_id }}
          EXPECTED_SHA: ${{ inputs.expected_sha }}
          CP_RELEASE_RECEIPT_SIGNING_SECRET: ${{ secrets.CP_RELEASE_RECEIPT_SIGNING_SECRET }}
        run: |
          [[ "$PROOF_RUN_ID" =~ ^[1-9][0-9]*$ ]]
          gh run view "$PROOF_RUN_ID" --repo "$GITHUB_REPOSITORY" --json conclusion,headSha,event > proof-run.json
          node - <<'NODE'
          const fs = require('node:fs');
          const run = JSON.parse(fs.readFileSync('proof-run.json', 'utf8'));
          if (run.conclusion !== 'success' || run.event !== 'workflow_dispatch') throw new Error('PROTECTED_PROOF_RUN_NOT_SUCCESSFUL');
          if (run.headSha !== process.env.EXPECTED_SHA) throw new Error('PROTECTED_PROOF_SHA_MISMATCH');
          NODE
          gh run download "$PROOF_RUN_ID" --repo "$GITHUB_REPOSITORY" \
            --name "protected-release-proof-$EXPECTED_SHA" --dir protected-proof
          node .github/scripts/protected-release-receipt.mjs verify \
            --input protected-proof/protected-release-receipt.json \
            --expected-sha "$EXPECTED_SHA" \
            --expected-release "${{ inputs.release }}" \
            --source-pull-request "${{ inputs.source_pr }}"

      - name: Activate Yarn Classic
        run: |
          corepack enable
          corepack prepare yarn@1.22.22 --activate

      - name: Install and verify
        run: |
          yarn install --frozen-lockfile
          yarn verify

      - name: Install pinned Vercel CLI
        run: yarn global add vercel@56.1.0

      - name: Pull Production project settings
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: vercel pull --yes --environment=production --token="$VERCEL_TOKEN"

      - name: Verify canonical Vercel project link
        run: |
          node - <<'NODE'
          const fs = require('node:fs');
          const link = JSON.parse(fs.readFileSync('.vercel/project.json', 'utf8'));
          if (link.projectId !== process.env.VERCEL_PROJECT_ID) throw new Error('VERCEL_PROJECT_LINK_MISMATCH');
          if (link.orgId !== process.env.VERCEL_ORG_ID) throw new Error('VERCEL_ORG_LINK_MISMATCH');
          NODE

      - name: Capture the last verified checkout-enabled Production deployment
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          vercel inspect www.carlophillips.com --format=json --token="$VERCEL_TOKEN" > production-before-candidate.json
          node scripts/verify-checkout-health.mjs \
            --url https://www.carlophillips.com \
            --output production-before-candidate-health.json

      - name: Build exact Production artifact
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: vercel build --prod --token="$VERCEL_TOKEN"

      - name: Stage candidate without assigning domains
        id: candidate
        env:
          RELEASE: ${{ inputs.release }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          deployment_url="$(vercel deploy --prebuilt --archive=tgz --prod --skip-domain --token="$VERCEL_TOKEN" \
            --env NEXT_PUBLIC_COMMERCE_ENVIRONMENT=production \
            --env NEXT_PUBLIC_SHOW_PRODUCTS=true \
            --env COMMERCE_DATA_MODE=shopify \
            --env SHOPIFY_CART_UI_ENABLED=true \
            --env SHOPIFY_CHECKOUT_ENABLED=true \
            --env CP_RELEASE_ID="$RELEASE" \
            --env CP_RELEASE_COMMIT_SHA="$GITHUB_SHA" \
            --meta gitCommitSha="$GITHUB_SHA" \
            --meta cpGitCommitSha="$GITHUB_SHA" \
            --meta cpRelease="$RELEASE" \
            --meta cpArtifactKind=staged-production \
            --meta cpBuildEnvironment=production \
            --meta cpCheckoutEnabled=true)"
          echo "url=$deployment_url" >> "$GITHUB_OUTPUT"

      - name: Verify immutable checkout-enabled candidate
        env:
          DEPLOYMENT_URL: ${{ steps.candidate.outputs.url }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          vercel inspect "$DEPLOYMENT_URL" --wait --timeout=5m --format=json --token="$VERCEL_TOKEN" > candidate-inspect.json
          curl --fail --silent --show-error --location --max-time 30 \
            "$DEPLOYMENT_URL/products/carlophillips-signature-hoodie" > candidate-pdp.html
          node - <<'NODE'
          const fs = require('node:fs');
          const html = fs.readFileSync('candidate-pdp.html', 'utf8');
          if (!html.includes('ADD TO BAG')) throw new Error('Candidate PDP is missing Add to Bag.');
          if (!html.includes('action="/api/cart"')) throw new Error('Candidate PDP is missing the Shopify cart handoff.');
          NODE
          vercel inspect www.carlophillips.com --format=json --token="$VERCEL_TOKEN" > production-after-candidate.json
          node - <<'NODE'
          const fs = require('node:fs');
          const before = JSON.parse(fs.readFileSync('production-before-candidate.json', 'utf8'));
          const after = JSON.parse(fs.readFileSync('production-after-candidate.json', 'utf8'));
          if (before.id !== after.id) throw new Error('PRODUCTION_CHANGED_WHILE_STAGING_CANDIDATE');
          NODE

      - name: Publish candidate receipt
        run: |
          {
            echo "## Checkout-enabled Production candidate"
            echo "- Deployment: ${{ steps.candidate.outputs.url }}"
            echo "- Commit: $GITHUB_SHA"
            echo "- Production domains assigned: no"
            echo "- Checkout enabled: true"
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: production-candidate-${{ github.sha }}
          path: |
            candidate-inspect.json
            candidate-pdp.html
            production-before-candidate.json
            production-before-candidate-health.json
            production-after-candidate.json
            protected-proof/protected-release-receipt.json
          if-no-files-found: error
          retention-days: 90
