name: Vercel Release Candidate

on:
  workflow_dispatch:
    inputs:
      expected_sha:
        description: Full 40-character canonical main SHA selected for this candidate
        required: true
        type: string
      release:
        description: Release identifier recorded in deployment metadata
        required: true
        type: string
      checkout_enabled:
        description: Stage a release-bound checkout candidate; the safe fallback always remains disabled
        required: true
        default: false
        type: boolean

permissions:
  actions: read
  contents: read

concurrency:
  group: vercel-production-release
  cancel-in-progress: false

jobs:
  deploy-candidate:
    name: Build staged Production candidate and safe fallback
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: Production
    env:
      VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
      NEXT_PUBLIC_COMMERCE_ENVIRONMENT: production
      COMMERCE_DATA_MODE: shopify
      SHOPIFY_CART_UI_ENABLED: ${{ inputs.checkout_enabled && 'true' || 'false' }}
      SHOPIFY_CHECKOUT_ENABLED: ${{ inputs.checkout_enabled && 'true' || 'false' }}

    steps:
      - name: Enforce protected candidate environment
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/environments/Production" > production-environment.json
          node - <<'NODE'
          const fs = require('node:fs');
          const environment = JSON.parse(fs.readFileSync('production-environment.json', 'utf8'));
          const reviewerRule = environment.protection_rules?.find(rule => rule.type === 'required_reviewers');
          if (!reviewerRule || !Array.isArray(reviewerRule.reviewers) || reviewerRule.reviewers.length === 0) {
            throw new Error('Candidate staging is disabled until the Production environment has a required reviewer.');
          }
          NODE

      - name: Check out canonical main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Validate immutable inputs
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha }}
          RELEASE: ${{ inputs.release }}
        run: |
          test "$GITHUB_REF" = "refs/heads/main"
          [[ "$EXPECTED_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$RELEASE" =~ ^[A-Za-z0-9._-]+$ ]]
          test "$EXPECTED_SHA" = "$GITHUB_SHA"
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          test -n "$VERCEL_ORG_ID"
          test -n "$VERCEL_PROJECT_ID"
          test "$NEXT_PUBLIC_COMMERCE_ENVIRONMENT" = "production"
          [[ "$SHOPIFY_CART_UI_ENABLED" =~ ^(true|false)$ ]]
          test "$SHOPIFY_CHECKOUT_ENABLED" = "$SHOPIFY_CART_UI_ENABLED"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: yarn
          cache-dependency-path: yarn.lock

      - name: Activate Yarn Classic
        run: |
          corepack enable
          corepack prepare yarn@1.22.22 --activate
          test "$(yarn --version)" = "1.22.22"

      - name: Install locked dependencies
        run: yarn install --frozen-lockfile

      - name: Verify repository before deployment
        run: yarn verify

      - name: Verify exact release before enabling Production checkout
        if: ${{ inputs.checkout_enabled }}
        env:
          RELEASE: ${{ inputs.release }}
        run: >-
          node scripts/verify-production-commerce-release.mjs
          --release "$RELEASE"
          --expected-sha "$GITHUB_SHA"

      - name: Install pinned Vercel CLI
        run: |
          yarn global add vercel@56.1.0
          echo "$(yarn global bin)" >> "$GITHUB_PATH"
          export PATH="$(yarn global bin):$PATH"
          test "$(vercel --version | tail -1)" = "56.1.0"

      - name: Pull Production project settings
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: vercel pull --yes --environment=production --token="$VERCEL_TOKEN"

      - name: Capture current Production before staging
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: >-
          vercel inspect www.carlophillips.com --format=json --token="$VERCEL_TOKEN"
          > production-before.json

      - name: Build exact Production artifact
        run: vercel build --prod

      - name: Stage exact Production candidate without assigning domains
        id: candidate
        env:
          RELEASE: ${{ inputs.release }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          deployment_url="$(vercel deploy --prebuilt --archive=tgz --prod --skip-domain --token="$VERCEL_TOKEN" \
            --env NEXT_PUBLIC_COMMERCE_ENVIRONMENT=production \
            --env COMMERCE_DATA_MODE=shopify \
            --env SHOPIFY_CART_UI_ENABLED="$SHOPIFY_CART_UI_ENABLED" \
            --env SHOPIFY_CHECKOUT_ENABLED="$SHOPIFY_CHECKOUT_ENABLED" \
            --meta gitCommitSha="$GITHUB_SHA" \
            --meta cpGitCommitSha="$GITHUB_SHA" \
            --meta cpGitCommitRef="$GITHUB_REF_NAME" \
            --meta cpRelease="$RELEASE" \
            --meta cpArtifactKind=staged-production \
            --meta cpBuildEnvironment=production \
            --meta cpCheckoutEnabled="$SHOPIFY_CHECKOUT_ENABLED" \
            --meta cpWorkflowRun="$GITHUB_RUN_ID" \
            --meta cpWorkflowAttempt="$GITHUB_RUN_ATTEMPT")"
          echo "url=$deployment_url" >> "$GITHUB_OUTPUT"

      - name: Stage distinct safe fallback without assigning domains
        id: fallback
        env:
          RELEASE: ${{ inputs.release }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          deployment_url="$(vercel deploy --prebuilt --archive=tgz --prod --skip-domain --token="$VERCEL_TOKEN" \
            --env NEXT_PUBLIC_COMMERCE_ENVIRONMENT=production \
            --env COMMERCE_DATA_MODE=shopify \
            --env SHOPIFY_CART_UI_ENABLED=false \
            --env SHOPIFY_CHECKOUT_ENABLED=false \
            --meta gitCommitSha="$GITHUB_SHA" \
            --meta cpGitCommitSha="$GITHUB_SHA" \
            --meta cpGitCommitRef="$GITHUB_REF_NAME" \
            --meta cpRelease="$RELEASE" \
            --meta cpArtifactKind=safe-fallback \
            --meta cpBuildEnvironment=production \
            --meta cpCheckoutEnabled=false \
            --meta cpWorkflowRun="$GITHUB_RUN_ID" \
            --meta cpWorkflowAttempt="$GITHUB_RUN_ATTEMPT")"
          echo "url=$deployment_url" >> "$GITHUB_OUTPUT"

      - name: Capture staged pair evidence
        env:
          CANDIDATE_URL: ${{ steps.candidate.outputs.url }}
          FALLBACK_URL: ${{ steps.fallback.outputs.url }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          vercel inspect "$CANDIDATE_URL" --wait --timeout=5m --format=json --token="$VERCEL_TOKEN" > candidate-inspect.json
          vercel inspect "$FALLBACK_URL" --wait --timeout=5m --format=json --token="$VERCEL_TOKEN" > fallback-inspect.json
          vercel list --meta cpGitCommitSha="$GITHUB_SHA" --limit=20 --format=json --token="$VERCEL_TOKEN" > staged-deployments.json
          vercel inspect www.carlophillips.com --format=json --token="$VERCEL_TOKEN" > production-after-staging.json

      - name: Verify staged candidate and safe fallback without deployment credential
        env:
          RELEASE: ${{ inputs.release }}
        run: |
          node .github/scripts/verify-vercel-receipt.mjs candidate-pair \
            --candidate-inspect candidate-inspect.json \
            --fallback-inspect fallback-inspect.json \
            --deployment-list staged-deployments.json \
            --production-before production-before.json \
            --production-after production-after-staging.json \
            --expected-sha "$GITHUB_SHA" \
            --expected-release "$RELEASE" \
            --expected-candidate-checkout "$SHOPIFY_CHECKOUT_ENABLED" \
            --output candidate-release-pair-receipt.json

      - name: Run release-aware staged pair route smoke test
        env:
          CANDIDATE_URL: ${{ steps.candidate.outputs.url }}
          FALLBACK_URL: ${{ steps.fallback.outputs.url }}
        run: |
          for artifact in candidate fallback; do
            if [ "$artifact" = "candidate" ]; then deployment_url="$CANDIDATE_URL"; else deployment_url="$FALLBACK_URL"; fi
            for route in / /shop /collections /products/carlophillips-signature-hoodie /bag; do
              curl --fail --silent --show-error --location --max-time 30 "${deployment_url}${route}" > /dev/null
            done
            curl --fail --silent --show-error --location --max-time 30 \
              "${deployment_url}/products/carlophillips-signature-hoodie" > "${artifact}-pdp.html"
            ARTIFACT="$artifact" node - <<'NODE'
          const fs = require('node:fs');
          const artifact = process.env.ARTIFACT;
          const checkoutEnabled = artifact === 'candidate' && process.env.SHOPIFY_CHECKOUT_ENABLED === 'true';
          const html = fs.readFileSync(`${artifact}-pdp.html`, 'utf8');
          if (checkoutEnabled) {
            if (!html.includes('Continue to checkout')) throw new Error('Candidate PDP is missing checkout continuation.');
            if (!html.includes('action="/api/checkout"')) throw new Error('Candidate PDP is missing the checkout endpoint.');
          } else {
            if (!html.includes('Selection disabled')) throw new Error(`${artifact} PDP is missing the disabled-selection proof.`);
            if (!html.includes('Purchasing disabled')) throw new Error(`${artifact} PDP is missing the fail-closed purchasing proof.`);
            if (html.includes('Continue to checkout')) throw new Error(`${artifact} PDP unexpectedly exposes checkout continuation.`);
            if (html.includes('action="/api/checkout"')) throw new Error(`${artifact} PDP unexpectedly exposes the checkout endpoint.`);
            if (/<form\b[^>]*>[\s\S]*?type=["']submit["']/i.test(html)) {
              throw new Error(`${artifact} PDP unexpectedly exposes an enabled submit form.`);
            }
          }
          NODE
          done

      - name: Remove pulled Production environment data
        run: |
          node - <<'NODE'
          const fs = require('node:fs');
          fs.rmSync('.vercel', { recursive: true, force: true });
          NODE

      - name: Publish workflow receipt
        env:
          CANDIDATE_URL: ${{ steps.candidate.outputs.url }}
          FALLBACK_URL: ${{ steps.fallback.outputs.url }}
        run: |
          {
            echo "## Vercel staged Production release pair"
            echo "- Candidate: $CANDIDATE_URL"
            echo "- Safe fallback: $FALLBACK_URL"
            echo "- Commit: $GITHUB_SHA"
            echo "- Production domains assigned: no"
            echo "- Candidate checkout enabled: $SHOPIFY_CHECKOUT_ENABLED"
            echo "- Safe fallback checkout enabled: false"
            echo "- Receipt artifact: candidate-release-pair-receipt"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload immutable release-pair receipt
        uses: actions/upload-artifact@v4
        with:
          name: candidate-release-pair-receipt-${{ github.sha }}
          path: |
            production-environment.json
            candidate-inspect.json
            fallback-inspect.json
            staged-deployments.json
            production-before.json
            production-after-staging.json
            candidate-release-pair-receipt.json
            candidate-pdp.html
            fallback-pdp.html
          if-no-files-found: error
          retention-days: 90
