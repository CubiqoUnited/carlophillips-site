name: Regenerate Playwright visual baselines

# Visual baselines are platform-specific. They live under
# tests/e2e/visual-baselines/linux/ because the gate that judges them runs on
# ubuntu-latest. No contributor on macOS can produce them honestly — darwin
# pixels committed to the linux directory would be fabricated evidence, and
# Aarti refused to write them, correctly.
#
# So the runner that judges the baselines generates them. This workflow renders
# on the same platform as the gate and uploads the result as an artifact.
# Sushma downloads it and commits it, so the update still passes through a
# reviewed commit rather than a bot push to a protected branch.
#
# Manual only. A baseline refresh is a product sign-off — Pushpa rules it,
# Sushma executes it — and it must never fire automatically on a push, because
# a baseline that regenerates itself can never fail.

# TEMPORARY TRIGGER — removed before this branch merges.
#
# workflow_dispatch only fires for workflows already on the default branch, and
# this one is not there yet, so it cannot be dispatched to generate the very
# baselines the gate needs in order to let it reach main. The pull_request
# trigger below breaks that circle by rendering from the PR head.
#
# It is scoped to this one branch and Sushma deletes it in the commit that lands
# the baselines. It must not survive the merge: a baseline job that fires
# automatically on every PR would let a baseline regenerate itself, and a
# baseline that regenerates itself can never fail.
on:
  pull_request:
    branches:
      - main
    paths:
      - 'tests/e2e/visual-baseline.spec.ts'
      - '.github/workflows/playwright-baselines.yml'
  workflow_dispatch:
    inputs:
      ref:
        description: Branch or SHA to render from
        required: true
        type: string
      reason:
        description: Jira key and the ruling that authorised this refresh
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: playwright-baselines-${{ github.event.inputs.ref || github.ref }}
  cancel-in-progress: false

jobs:
  regenerate:
    name: Render baselines on the gate's own platform
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Record the authorisation in the run itself
        run: |
          echo "### Baseline regeneration" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- ref: \`${{ github.event.inputs.ref || github.event.pull_request.head.sha }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- authorised by: ${{ github.event.inputs.reason || 'KAN-29 temporary PR trigger' }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- requested by: @${{ github.actor }}" >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.ref || github.event.pull_request.head.sha }}

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: yarn

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Install Playwright browsers
        run: yarn playwright install --with-deps chromium

      - name: Render baselines
        env:
          CP_A11Y_OUTPUT_DIR: test_reports/ci/playwright
        # --update-snapshots rewrites the committed PNGs in place. The step is
        # expected to succeed; a failure here means the spec itself is broken,
        # not that the baseline differs.
        run: yarn test:e2e --update-snapshots

      - name: Show what changed
        if: always()
        run: |
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          git -c core.pager=cat diff --stat -- tests/e2e/visual-baselines/ >> "$GITHUB_STEP_SUMMARY" || true
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: Upload regenerated baselines
        uses: actions/upload-artifact@v4
        with:
          name: visual-baselines
          path: tests/e2e/visual-baselines/
          if-no-files-found: error
          retention-days: 7
