name: Protected Staging Release Proof

on:
  workflow_dispatch:
    inputs:
      expected_sha:
        description: Exact current staging SHA deployed and tested on protected Staging
        required: true
        type: string
      source_pr:
        description: Merged pull request whose merge commit is expected_sha
        required: true
        type: number
      release:
        description: Immutable release identifier used by the Staging deployment
        required: true
        type: string
      staging_run_id:
        description: Successful Protected Vercel Staging workflow run ID
        required: true
        type: string

permissions:
  actions: read
  contents: read
  pull-requests: read

concurrency:
  group: protected-staging-release-proof
  cancel-in-progress: false

jobs:
  prove-release:
    name: Issue signed PII-free Staging receipt
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: Staging
    env:
      VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
      VERCEL_SCOPE: ${{ vars.VERCEL_SCOPE }}

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.expected_sha }}
          fetch-depth: 0

      - name: Validate exact combined staging commit and merged source pull request
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha }}
          SOURCE_PR: ${{ inputs.source_pr }}
          RELEASE: ${{ inputs.release }}
          STAGING_RUN_ID: ${{ inputs.staging_run_id }}
          GH_TOKEN: ${{ github.token }}
        run: |
          [[ "$EXPECTED_SHA" =~ ^[a-f0-9]{40}$ ]]
          [[ "$SOURCE_PR" =~ ^[1-9][0-9]*$ ]]
          [[ "$STAGING_RUN_ID" =~ ^[1-9][0-9]*$ ]]
          [[ "$RELEASE" =~ ^[A-Za-z0-9._-]+$ ]]
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          git fetch --no-tags origin staging
          test "$(git rev-parse origin/staging)" = "$EXPECTED_SHA"
          gh api "repos/$GITHUB_REPOSITORY/pulls/$SOURCE_PR" > source-pr.json
          node - <<'NODE'
          const fs = require('node:fs');
          const pull = JSON.parse(fs.readFileSync('source-pr.json', 'utf8'));
          if (!pull.merged_at || pull.base?.ref !== 'staging') throw new Error('SOURCE_PR_NOT_MERGED_TO_STAGING');
          if (pull.merge_commit_sha !== process.env.EXPECTED_SHA) throw new Error('SOURCE_PR_MERGE_SHA_MISMATCH');
          NODE

      - name: Download the exact protected Staging customer-path evidence
        env:
          GH_TOKEN: ${{ github.token }}
          STAGING_RUN_ID: ${{ inputs.staging_run_id }}
          EXPECTED_SHA: ${{ inputs.expected_sha }}
        run: |
          gh run view "$STAGING_RUN_ID" --repo "$GITHUB_REPOSITORY" \
            --json conclusion,headSha,event > staging-run.json
          node - <<'NODE'
          const fs = require('node:fs');
          const run = JSON.parse(fs.readFileSync('staging-run.json', 'utf8'));
          if (run.conclusion !== 'success' || run.event !== 'workflow_dispatch') throw new Error('STAGING_RUN_NOT_SUCCESSFUL');
          if (run.headSha !== process.env.EXPECTED_SHA) throw new Error('STAGING_RUN_SHA_MISMATCH');
          NODE
          gh run download "$STAGING_RUN_ID" --repo "$GITHUB_REPOSITORY" \
            --name "staging-receipt-$EXPECTED_SHA" --dir staging-evidence

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install pinned Vercel CLI
        run: |
          corepack enable
          corepack prepare yarn@1.22.22 --activate
          test "$(yarn --version)" = "1.22.22"
          yarn global add vercel@56.1.0

      - name: Recheck healthy checkout-enabled Production after Staging validation
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          vercel inspect www.carlophillips.com --format=json --scope="$VERCEL_SCOPE" --token="$VERCEL_TOKEN" > production-after-proof.json
          node scripts/verify-checkout-health.mjs \
            --url https://www.carlophillips.com \
            --output production-after-proof-health.json

      - name: Assemble Shopify, handoff, isolation, visual and rollback evidence
        env:
          SHOPIFY_STAGING_STORE_DOMAIN: ${{ vars.SHOPIFY_STAGING_STORE_DOMAIN }}
          SHOPIFY_PRODUCTION_STORE_DOMAIN: ${{ vars.SHOPIFY_PRODUCTION_STORE_DOMAIN }}
          CP_EXPECTED_PREVIEW_DURABLE_STORE_ID: ${{ vars.CP_EXPECTED_PREVIEW_DURABLE_STORE_ID }}
          CP_EXPECTED_PRODUCTION_DURABLE_STORE_ID: ${{ vars.CP_EXPECTED_PRODUCTION_DURABLE_STORE_ID }}
        run: >-
          node scripts/collect-protected-shopify-proof.mjs finalize
          --browser-proof-directory staging-evidence/test_reports/protected-staging
          --deployment-receipt staging-evidence/protected-staging-deployment-receipt.json
          --webhook-probe staging-evidence/staging-webhook-probe.json
          --production-before-inspect staging-evidence/production-before-staging.json
          --production-after-inspect production-after-proof.json
          --production-before-health staging-evidence/production-before-health.json
          --production-after-health production-after-proof-health.json
          --source-pull-request "${{ inputs.source_pr }}"
          --expected-sha "${{ inputs.expected_sha }}"
          --release "${{ inputs.release }}"
          --output unsigned-protected-release-receipt.json

      - name: Sign and independently verify the PII-free release receipt
        env:
          CP_RELEASE_RECEIPT_SIGNING_SECRET: ${{ secrets.CP_RELEASE_RECEIPT_SIGNING_SECRET }}
        run: |
          node .github/scripts/protected-release-receipt.mjs sign \
            --input unsigned-protected-release-receipt.json \
            --output protected-release-receipt.json
          node .github/scripts/protected-release-receipt.mjs verify \
            --input protected-release-receipt.json \
            --expected-staging-sha "${{ inputs.expected_sha }}" \
            --expected-release "${{ inputs.release }}" \
            --source-pull-request "${{ inputs.source_pr }}"

      - name: Publish protected release summary
        run: |
          {
            echo "## Protected Staging release proof"
            echo "- Exact combined commit: ${{ inputs.expected_sha }}"
            echo "- Source PR: #${{ inputs.source_pr }}"
            echo "- Sanitized hosted-checkout handoff with no retained private URL: verified"
            echo "- Payment/order submission: not attempted"
            echo "- Signed synthetic webhook and durable duplicate suppression: verified"
            echo "- Production approval: not granted by this receipt"
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: protected-release-proof-${{ inputs.expected_sha }}
          path: |
            protected-release-receipt.json
            production-after-proof.json
            production-after-proof-health.json
          if-no-files-found: error
          retention-days: 90
