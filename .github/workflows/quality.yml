name: Quality

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Frozen install, lint, test, audit, build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn
      - run: corepack enable
      - run: yarn install --frozen-lockfile
      - run: yarn lint
      - run: mkdir -p test_reports/ci
      - run: yarn test --reporter=default --reporter=junit --outputFile.junit=test_reports/ci/junit.xml
      - run: yarn audit:prod
      - run: yarn build
      - name: Install headless accessibility browser
        run: yarn playwright install --with-deps chromium
      - name: Run accessibility and privacy network audit
        env:
          CP_A11Y_OUTPUT_DIR: test_reports/ci/accessibility
        run: |
          yarn start > /tmp/cp-next-start.log 2>&1 &
          app_pid=$!
          trap 'kill "$app_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 30); do
            curl --fail --silent http://127.0.0.1:3000/ > /dev/null && break
            if [ "$attempt" -eq 30 ]; then
              cat /tmp/cp-next-start.log
              exit 1
            fi
            sleep 1
          done
          yarn test:a11y
      - name: Upload test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quality-evidence-${{ github.sha }}
          path: test_reports/ci/
          if-no-files-found: warn
          retention-days: 30
