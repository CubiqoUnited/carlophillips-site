name: Protected Vercel Staging

on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: Merged source pull request number targeting staging
        required: true
        type: number
      expected_sha:
        description: Full 40-character merged staging SHA
        required: true
        type: string
      release:
        description: Immutable Staging review identifier
        required: true
        type: string

permissions:
  actions: read
  contents: read
  pull-requests: read

concurrency:
  group: protected-vercel-staging
  cancel-in-progress: false

jobs:
  deploy-staging:
    name: Deploy exact merged staging SHA to staging.carlophillips.com
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment:
      name: Staging
      url: https://staging.carlophillips.com
    env:
      VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
      VERCEL_SCOPE: ${{ vars.VERCEL_SCOPE }}
      NEXT_PUBLIC_COMMERCE_ENVIRONMENT: preview
      NEXT_PUBLIC_SHOW_PRODUCTS: 'true'
      COMMERCE_DATA_MODE: shopify
      SHOPIFY_CART_UI_ENABLED: 'true'
      SHOPIFY_CHECKOUT_ENABLED: 'true'
      CP_RELEASE_ID: ${{ inputs.release }}
      CP_RELEASE_COMMIT_SHA: ${{ inputs.expected_sha }}

    steps:
      - name: Enforce protected Staging environment
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/environments/Staging" > staging-environment.json
          node - <<'NODE'
          const fs = require('node:fs');
          const environment = JSON.parse(fs.readFileSync('staging-environment.json', 'utf8'));
          const reviewers = environment.protection_rules?.find((rule) => rule.type === 'required_reviewers')?.reviewers;
          if (!Array.isArray(reviewers) || reviewers.length === 0) throw new Error('STAGING_REVIEWER_REQUIRED');
          NODE

      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.expected_sha }}
          fetch-depth: 0

      - name: Validate exact merged-staging input
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha }}
          PR_NUMBER: ${{ inputs.pr_number }}
          RELEASE: ${{ inputs.release }}
          GH_TOKEN: ${{ github.token }}
        run: |
          [[ "$EXPECTED_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$PR_NUMBER" =~ ^[0-9]+$ ]]
          [[ "$RELEASE" =~ ^[A-Za-z0-9._-]+$ ]]
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          git fetch --no-tags origin staging
          test "$(git rev-parse origin/staging)" = "$EXPECTED_SHA"
          gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER" > staging-pr.json
          node - <<'NODE'
          const fs = require('node:fs');
          const pull = JSON.parse(fs.readFileSync('staging-pr.json', 'utf8'));
          if (pull.state !== 'closed' || !pull.merged_at) throw new Error('STAGING_PR_MUST_BE_MERGED');
          if (pull.base?.ref !== 'staging') throw new Error('STAGING_PR_BASE_MUST_BE_STAGING');
          if (pull.merge_commit_sha !== process.env.EXPECTED_SHA) throw new Error('STAGING_MERGE_SHA_MISMATCH');
          NODE
          test "$SHOPIFY_CART_UI_ENABLED" = "true"
          test "$SHOPIFY_CHECKOUT_ENABLED" = "true"
          test "$CP_RELEASE_ID" = "$RELEASE"
          test "$CP_RELEASE_COMMIT_SHA" = "$EXPECTED_SHA"
          test -n "$VERCEL_ORG_ID"
          test -n "$VERCEL_PROJECT_ID"
          test -n "$VERCEL_SCOPE"

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: yarn
          cache-dependency-path: yarn.lock

      - name: Install and verify repository
        run: |
          corepack enable
          corepack prepare yarn@1.22.22 --activate
          yarn install --frozen-lockfile
          yarn playwright install --with-deps chromium
          yarn verify
          yarn test:e2e

      - name: Install pinned Vercel CLI
        run: yarn global add vercel@56.1.0

      - name: Pull isolated Preview settings
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: vercel pull --yes --environment=preview --scope="$VERCEL_SCOPE" --token="$VERCEL_TOKEN"

      - name: Verify canonical Vercel project link
        run: |
          node - <<'NODE'
          const fs = require('node:fs');
          const link = JSON.parse(fs.readFileSync('.vercel/project.json', 'utf8'));
          if (link.projectId !== process.env.VERCEL_PROJECT_ID) throw new Error('VERCEL_PROJECT_LINK_MISMATCH');
          if (link.orgId !== process.env.VERCEL_ORG_ID) throw new Error('VERCEL_ORG_LINK_MISMATCH');
          NODE

      - name: Capture healthy checkout-enabled Production before Staging
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          vercel inspect www.carlophillips.com --format=json --scope="$VERCEL_SCOPE" --token="$VERCEL_TOKEN" > production-before-staging.json
          node scripts/verify-checkout-health.mjs \
            --url https://www.carlophillips.com \
            --output production-before-health.json

      - name: Build immutable Staging artifact
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: vercel build --scope="$VERCEL_SCOPE" --token="$VERCEL_TOKEN"

      - name: Deploy without aliases
        id: staging
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha }}
          RELEASE: ${{ inputs.release }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          deployment_url="$(vercel deploy --prebuilt --archive=tgz --token="$VERCEL_TOKEN" --scope="$VERCEL_SCOPE" \
            --env NEXT_PUBLIC_COMMERCE_ENVIRONMENT=preview \
            --env NEXT_PUBLIC_SHOW_PRODUCTS=true \
            --env COMMERCE_DATA_MODE=shopify \
            --env SHOPIFY_CART_UI_ENABLED=true \
            --env SHOPIFY_CHECKOUT_ENABLED=true \
            --env CP_RELEASE_ID="$RELEASE" \
            --env CP_RELEASE_COMMIT_SHA="$EXPECTED_SHA" \
            --meta gitCommitSha="$EXPECTED_SHA" \
            --meta cpGitCommitSha="$EXPECTED_SHA" \
            --meta cpRelease="$RELEASE" \
            --meta cpPullRequest="${{ inputs.pr_number }}" \
            --meta cpArtifactKind=protected-staging \
            --meta cpBuildEnvironment=preview \
            --meta cpCheckoutEnabled=true)"
          echo "url=$deployment_url" >> "$GITHUB_OUTPUT"

      - name: Verify deployment before aliasing
        env:
          DEPLOYMENT_URL: ${{ steps.staging.outputs.url }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          vercel inspect "$DEPLOYMENT_URL" --wait --timeout=5m --format=json --scope="$VERCEL_SCOPE" --token="$VERCEL_TOKEN" > staging-inspect.json
          for route in / /shop /collections /products/carlophillips-signature-hoodie /bag; do
            vercel curl "$DEPLOYMENT_URL$route" -- \
              --fail --silent --show-error --location --max-time 30 > /dev/null
          done
          vercel curl "$DEPLOYMENT_URL/products/carlophillips-signature-hoodie" -- \
            --fail --silent --show-error --location --max-time 30 > staging-pdp.html
          node - <<'NODE'
          const fs = require('node:fs');
          const html = fs.readFileSync('staging-pdp.html', 'utf8');
          if (!html.includes('ADD TO BAG')) throw new Error('STAGING_ADD_TO_BAG_MISSING');
          if (!html.includes('action="/api/cart"')) throw new Error('STAGING_CART_HANDOFF_MISSING');
          NODE

      - name: Capture project identity for the immutable receipt
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: >-
          vercel list --meta cpGitCommitSha="${{ inputs.expected_sha }}"
          --limit=20 --format=json --scope="$VERCEL_SCOPE" --token="$VERCEL_TOKEN"
          > staging-deployments.json

      - name: Assign protected Staging domain
        env:
          DEPLOYMENT_URL: ${{ steps.staging.outputs.url }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: vercel alias set "$DEPLOYMENT_URL" staging.carlophillips.com --scope="$VERCEL_SCOPE" --token="$VERCEL_TOKEN"

      - name: Run signed PII-free webhook probe
        env:
          CP_WEBHOOK_BASE_URL: ${{ steps.staging.outputs.url }}
          SHOPIFY_WEBHOOK_SECRET: ${{ secrets.SHOPIFY_STAGING_WEBHOOK_SECRET }}
          SHOPIFY_WEBHOOK_ALLOWED_SHOPS: ${{ vars.SHOPIFY_STAGING_STORE_DOMAIN }}
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
          CP_WEBHOOK_PROBE_OUTPUT: staging-webhook-probe.json
        run: yarn verify:webhook-endpoint

      - name: Run exact-width Staging functional, a11y and screenshot checks
        env:
          CP_RELEASE_GATE_BASE_URL: ${{ steps.staging.outputs.url }}
          CP_RELEASE_GATE_OUTPUT_DIR: test_reports/protected-staging
          SHOPIFY_STAGING_CHECKOUT_HOSTS: ${{ vars.SHOPIFY_STAGING_CHECKOUT_HOSTS }}
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
        run: yarn playwright test --config=playwright.release.config.ts

      - name: Capture unchanged healthy Production and exact Staging alias
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          vercel inspect www.carlophillips.com --format=json --scope="$VERCEL_SCOPE" --token="$VERCEL_TOKEN" > production-after-staging.json
          vercel inspect staging.carlophillips.com --format=json --scope="$VERCEL_SCOPE" --token="$VERCEL_TOKEN" > staging-alias-inspect.json
          node scripts/verify-checkout-health.mjs \
            --url https://www.carlophillips.com \
            --output production-after-health.json

      - name: Verify and publish immutable Staging deployment receipt
        env:
          RELEASE: ${{ inputs.release }}
          PR_NUMBER: ${{ inputs.pr_number }}
        run: |
          node .github/scripts/verify-vercel-receipt.mjs staging \
            --staging-inspect staging-inspect.json \
            --staging-alias-inspect staging-alias-inspect.json \
            --deployment-list staging-deployments.json \
            --production-before production-before-staging.json \
            --production-after production-after-staging.json \
            --expected-sha "$GITHUB_SHA" \
            --expected-release "$RELEASE" \
            --expected-pull-request "$PR_NUMBER" \
            --output protected-staging-deployment-receipt.json

      - name: Publish Staging receipt
        run: |
          {
            echo "## Protected Staging deployment"
            echo "- URL: https://staging.carlophillips.com"
            echo "- Immutable deployment: ${{ steps.staging.outputs.url }}"
            echo "- Commit: ${{ inputs.expected_sha }}"
            echo "- Checkout enabled: true"
            echo "- Shopify-origin test order and Admin API audit are deferred follow-up checks"
            echo "- Production remained healthy and checkout-enabled: true"
            echo "- Receipt is preliminary until the protected test-order lifecycle proof passes"
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: staging-receipt-${{ inputs.expected_sha }}
          path: |
            staging-environment.json
            staging-pr.json
            staging-inspect.json
            staging-alias-inspect.json
            staging-deployments.json
            staging-pdp.html
            protected-staging-deployment-receipt.json
            staging-webhook-probe.json
            production-before-staging.json
            production-after-staging.json
            production-before-health.json
            production-after-health.json
            test_reports/**
          if-no-files-found: error
          retention-days: 90

  snapshot-shopify:
    name: Capture exact pre-order Shopify inventory snapshot
    needs: deploy-staging
    if: ${{ vars.CP_STAGING_CAPTURE_SHOPIFY_SNAPSHOT == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: Staging

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.expected_sha }}
          fetch-depth: 0

      - name: Validate exact current Staging SHA
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha }}
        run: |
          [[ "$EXPECTED_SHA" =~ ^[a-f0-9]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          git fetch --no-tags origin staging
          test "$(git rev-parse origin/staging)" = "$EXPECTED_SHA"

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Capture read-only pre-order Shopify snapshot
        env:
          SHOPIFY_STAGING_STORE_DOMAIN: ${{ vars.SHOPIFY_STAGING_STORE_DOMAIN }}
          SHOPIFY_PRODUCTION_STORE_DOMAIN: ${{ vars.SHOPIFY_PRODUCTION_STORE_DOMAIN }}
          SHOPIFY_STAGING_ADMIN_TOKEN: ${{ secrets.SHOPIFY_STAGING_ADMIN_TOKEN }}
          CP_EXPECTED_PREVIEW_DURABLE_STORE_ID: ${{ vars.CP_EXPECTED_PREVIEW_DURABLE_STORE_ID }}
          CP_EXPECTED_PRODUCTION_DURABLE_STORE_ID: ${{ vars.CP_EXPECTED_PRODUCTION_DURABLE_STORE_ID }}
        run: >-
          node scripts/collect-protected-shopify-proof.mjs snapshot
          --expected-sha "${{ inputs.expected_sha }}"
          --release "${{ inputs.release }}"
          --output staging-shopify-snapshot.json

      - name: Publish pre-order snapshot summary
        run: |
          {
            echo "## Protected Staging Shopify snapshot"
            echo "- Exact Staging commit: ${{ inputs.expected_sha }}"
            echo "- Source PR: #${{ inputs.pr_number }}"
            echo "- Shopify Admin access: read-only observation"
            echo "- Payment/order submitted: no"
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: staging-shopify-snapshot-${{ inputs.expected_sha }}
          path: staging-shopify-snapshot.json
          if-no-files-found: error
          retention-days: 90
