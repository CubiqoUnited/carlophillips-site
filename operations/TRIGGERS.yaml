# v3.8 (2026-09-16) rule — not yet an active trigger, documented for future activation:
#   delegated_completion_reconciliation: when a sub-agent/delegated role reports work done, the coordinator (Sushma)
#   must read the result, update NOW.md, close/reopen the relevant gate, and select the next executable action
#   immediately rather than waiting for the next scheduled wake. No trigger entry defined yet — Sushma's checklist
#   (checklists/sushma-delivery.md) carries this as a manual-first rule until a trigger is authorized.

role_queue_wake:
  source: scheduler
  registry: operations/AUTOMATIONS.yaml
  condition: interval_elapsed_and_owned_ready_item_exists
  action: invoke_role_for_highest_priority_ready_owned
  idle_behavior: exit_no_record_no_message
  idempotency_key: ${role}-${ready_item_id}
  retry_attempt_id: ${role}-${ready_item_id}-${attempt_number}

storefront_monitor_alert:
  source: scripts/verify-checkout-health.mjs
  registry: operations/MONITORS.yaml
  condition: verified_monitor_failure
  action: create_incident_handoff_for_sushma
  idempotency_key: storefront-alert-${environment}-${scheduled_at}
